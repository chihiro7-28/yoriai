<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="「よりあい」はスマホ1台を回して遊ぶ、無料のパーティーゲーム集。3人から、ダウンロード不要ですぐ遊べます。飲み会や家族の集まり、授業のアイスブレイクにも。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chihiro7-28.github.io/yoriai/">

<meta property="og:description" content="「よりあい」はスマホ1台を回して遊ぶ、無料のパーティーゲーム集。3人から、ダウンロード不要ですぐ遊べます。">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chihiro7-28.github.io/yoriai/ogp-image.png">
<meta name="twitter:title" content="よりあい — スマホ1台で遊べるパーティーゲーム集">
<meta name="twitter:description" content="「よりあい」はスマホ1台を回して遊ぶ、無料のパーティーゲーム集。3人から、ダウンロード不要ですぐ遊べます。">
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

:root{
  --ink:#fdf6ea;--ink-2:#fffaf0;--ink-3:#f7ecd6;
  --paper:#241f18;--paper-dim:#5a5041;--paper-line:rgba(36,31,24,0.14);
  --stamp:#d6432c;--stamp-dim:rgba(214,67,44,0.4);
  --gold:#a8761f;--gold-dim:rgba(168,118,31,0.35);
  --muted:rgba(36,31,24,0.5);--good:#2f8f5b;--sky:#2477a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;background:#fdf6ea;}
body{display:flex;justify-content:center;}

.app{
  position:relative;width:100%;min-height:100vh;
  background:
    radial-gradient(circle at 1px 1px, rgba(36,31,24,0.05) 1px, transparent 0) 0 0/22px 22px,
    var(--ink);
  color:var(--paper);
  font-family:'IBM Plex Mono',monospace;
  display:flex;flex-direction:column;
}
@media (min-width:640px){ .app{ max-width:640px; } }
@media (min-width:1024px){ .app{ max-width:880px; } }

.serif{font-family:'Shippori Mincho',serif;}

/* ヘッダー(タイトル画面と揃えた意匠) */
.hero{padding:calc(env(safe-area-inset-top,0px) + 44px) 26px 30px;text-align:center;}
.hero-badge{display:flex;gap:9px;justify-content:center;margin-bottom:16px;}
.hero-badge-dot{width:20px;height:20px;border-radius:50%;}
.hero-badge-dot.d1{background:linear-gradient(160deg,#ff8a65,#ff5f6d);}
.hero-badge-dot.d2{background:linear-gradient(160deg,#ffd166,#ff9f5f);}
.hero-badge-dot.d3{background:linear-gradient(160deg,#8fd3c8,#5fb6ff);}
.hero-title{
  font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;
  font-size:clamp(34px,10vw,44px);letter-spacing:1px;
  background:linear-gradient(135deg,#ff8a65,#ffd166,#5fb6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:6px;
}
.hero-caption{font-size:10px;letter-spacing:4px;color:var(--muted);margin-bottom:14px;}
.hero-lead{font-size:12.5px;color:var(--muted);line-height:1.9;letter-spacing:0.3px;}
.hero-lead b{color:var(--paper);font-weight:600;}

/* ゲーム一覧 */
.list{flex:1;padding:6px 22px 30px;display:flex;flex-direction:column;gap:14px;}
@media (min-width:640px){
  .list{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .section-title{grid-column:1 / -1;}
  .hero-title{font-size:56px;}
  .hero-lead{font-size:14px;}
}
.section-title{
  font-size:10px;letter-spacing:3px;color:var(--gold);margin:14px 2px 2px;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--gold-dim);}

.game-card{
  display:block;text-decoration:none;color:inherit;
  background:var(--ink-2);border:1px solid var(--paper-line);border-left:3px solid var(--stamp);
  padding:16px 18px;transition:border-color 0.15s,background 0.15s,transform 0.1s;
}
.game-card:active{transform:scale(0.98);background:var(--ink-3);}
.game-card.disabled{border-left-color:var(--paper-line);opacity:0.55;pointer-events:none;}

.game-card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.game-file-no{font-size:9px;letter-spacing:2px;color:var(--gold);}
.game-status{font-size:9px;letter-spacing:1px;color:var(--good);}
.game-status.soon{color:var(--muted);}

.game-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.game-desc{font-size:12px;color:var(--muted);line-height:1.7;letter-spacing:0.3px;margin-bottom:10px;}
.game-meta{display:flex;gap:10px;flex-wrap:wrap;}
.game-tag{font-size:9.5px;letter-spacing:1px;color:var(--paper);background:rgba(168,118,31,0.12);border:1px solid var(--gold-dim);padding:4px 9px;}

.footer{
  padding:18px 26px calc(env(safe-area-inset-bottom,0px) + 26px);
  border-top:1px solid var(--gold-dim);
  font-size:10.5px;color:var(--muted);line-height:1.9;letter-spacing:0.3px;
}
.ad-slot{
  margin:6px 22px 0;padding:22px 14px;text-align:center;
  border:1px dashed var(--paper-line);color:var(--muted);
  font-size:10px;letter-spacing:2px;
}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="hero-badge">
      <div class="hero-badge-dot d1"></div>
      <div class="hero-badge-dot d2"></div>
      <div class="hero-badge-dot d3"></div>
    </div>
    <div class="hero-title">よりあい</div>
    <div class="hero-caption">YORIAI</div>
    <p class="hero-lead">
      <b>スマホ1台を回して遊ぶ</b>、無料のパーティーゲーム集。<br>
      3人から、ダウンロード不要ですぐ遊べます。<br>
      飲み会や家族の集まり、授業のアイスブレイクにも。
    </p>
  </div>

  <div class="list">
    <div class="section-title">GAMES</div>

    <a class="game-card" href="games/itoguchi/">
      <div class="game-card-top">
        <span class="game-file-no">FILE No.01</span>
        <span class="game-status">プレイ可能</span>
      </div>
      <div class="game-title">糸口</div>
      <div class="game-desc">数字は言わずに、たとえ話だけで伝え合う。価値観がバレる、協力ならべゲーム。</div>
      <div class="game-meta">
        <span class="game-tag">3人〜</span>
        <span class="game-tag">協力型</span>
        <span class="game-tag">約10分</span>
      </div>
    </a>

    <a class="game-card" href="games/ippikiokami/">
      <div class="game-card-top">
        <span class="game-file-no">FILE No.02</span>
        <span class="game-status">プレイ可能</span>
      </div>
      <div class="game-title">一匹狼</div>
      <div class="game-desc">多数派には同じお題、あなただけ違うかも。会話の中から、たった1人を見つけ出す正体隠匿ゲーム。</div>
      <div class="game-meta">
        <span class="game-tag">3人〜</span>
        <span class="game-tag">正体隠匿</span>
        <span class="game-tag">約10分</span>
      </div>
    </a>
  </div>

  <!-- ===== 広告枠 =====
       AdSense等の審査が通ったら、この中にins.adsbygoogleタグを入れる想定。
       今はプレースホルダーのみ表示。 -->
  <div class="ad-slot">広告スペース</div>

  <div class="footer">
    「よりあい」は個人開発のパーティーゲーム集です。特定の企業・商品とは関係ありません。
  </div>

</div>
</body>
</html>
